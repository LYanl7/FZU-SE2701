[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arrow-game-task02"
version = "0.1.0"
description = "A Pygame game inspired by 一箭又一箭"
requires-python = ">=3.10"
dependencies = [
    "pygame>=2.5,<3.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
